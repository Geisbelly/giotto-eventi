<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Convite</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23b4781f'/><path d='M32 14l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z' fill='%23fff'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
  <style id="base-css">
    :root {
      --bg: #f6f1e9; --papel: #fffdf9; --tinta: #2a241d; --suave: #6f665b; --linha: #e6ddd0;
      --cor: #b4781f; --cor-escura: #8a5a12; --cor-fundo: #f7ecd9;
      --titulo: 'Fraunces', Georgia, serif; --texto: 'Inter', system-ui, sans-serif;
      color-scheme: light;
    }
    body[data-estilo="rosa"] { --cor: #c05a7e; --cor-escura: #9a3d60; --cor-fundo: #f9e6ec; --bg: #f8eef0; }
    body[data-estilo="azul"] { --cor: #3f74b5; --cor-escura: #2a5590; --cor-fundo: #e4eef9; --bg: #edf2f8; }
    body[data-estilo="verde"] { --cor: #4c8a5c; --cor-escura: #336944; --cor-fundo: #e3f1e6; --bg: #eef4ef; }
    body[data-estilo="lilas"] { --cor: #8460b0; --cor-escura: #634390; --cor-fundo: #eee6f8; --bg: #f2eef7; }
    body[data-estilo="sol"] { --cor: #d97a1e; --cor-escura: #a95a0d; --cor-fundo: #fcebd6; --bg: #fbf2e6; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--tinta); font: 16px/1.5 var(--texto); min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .cartao { background: var(--papel); border-radius: 22px; box-shadow: 0 1px 2px rgba(40,30,15,.06), 0 18px 50px -20px rgba(40,30,15,.25); overflow: hidden; position: relative; }
    .faixa { height: 10px; background: repeating-linear-gradient(90deg, var(--cor) 0 26px, var(--cor-fundo) 26px 52px); }
    .conteudo { padding: 34px 28px 30px; text-align: center; }
    .ola { margin: 0 0 4px; font-size: .95rem; color: var(--cor-escura); font-weight: 600; letter-spacing: .02em; }
    .chamada { margin: 0 0 18px; color: var(--suave); font-size: .95rem; }
    .enfeite { display: block; margin: 0 auto 14px; width: 54px; height: 54px; color: var(--cor); }
    h1 { font-family: var(--titulo); font-weight: 650; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.08; margin: 0 0 8px; overflow-wrap: anywhere; }
    .tema { font-family: var(--titulo); font-style: italic; color: var(--cor-escura); margin: 0 0 22px; font-size: 1.1rem; }
    .quando { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 0 auto 22px; max-width: 380px; }
    .quando .lado { border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha); padding: 8px 0; font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; color: var(--suave); }
    .quando .dia { font-family: var(--titulo); font-size: 3rem; line-height: 1; color: var(--cor-escura); font-weight: 650; }
    .quando .mes { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--suave); }
    .data-longa { margin: -10px 0 0; color: var(--suave); font-size: .9rem; }
    .local { background: var(--cor-fundo); border-radius: 14px; padding: 14px 16px; margin: 0 0 20px; }
    .local strong { display: block; font-size: 1.02rem; }
    .local span { display: block; color: var(--suave); font-size: .9rem; }
    .local a { display: inline-block; margin-top: 8px; color: var(--cor-escura); font-weight: 600; font-size: .9rem; }
    .mensagem { white-space: pre-line; margin: 22px 0 0; font-size: 1.05rem; line-height: 1.6; }
    .secao-avisos { margin: 22px 0 0; } .secao-avisos .paginas-botoes { margin: 0; }
    .prazo { color: var(--suave); font-size: .88rem; margin: 14px 0 0; }
    .rsvp { border-top: 1px dashed var(--linha); padding: 26px 24px 28px; }
    .rsvp h2 { font-family: var(--titulo); font-weight: 650; font-size: 1.45rem; margin: 0 0 4px; text-align: center; }
    .rsvp .sub { text-align: center; color: var(--suave); margin: 0 0 18px; font-size: .92rem; }
    .rsvp .pres-escolhido { margin-top: -8px; padding: 10px 14px; border-radius: 12px; background: var(--cor-fundo, #f7ecd9); color: var(--cor-escura, #8a5a12); }
    .campo { display: block; margin-bottom: 14px; }
    .campo > span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 5px; }
    input, select, textarea { width: 100%; font: inherit; color: inherit; background: #fff; border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--cor); outline-offset: 1px; border-color: var(--cor); }
    .escolha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .escolha button { min-height: 52px; padding: 6px; border-radius: 12px; border: 1.5px solid var(--linha); background: #fff; font: 600 1rem var(--texto); color: var(--tinta); cursor: pointer; }
    @media (max-width: 400px) { .escolha { grid-template-columns: 1fr; } .escolha button { min-height: 46px; } }
    .escolha button[aria-pressed="true"] { border-color: var(--cor); background: var(--cor-fundo); color: var(--cor-escura); }
    .duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .contador { display: flex; align-items: center; border: 1px solid var(--linha); border-radius: 10px; background: #fff; overflow: hidden; }
    .contador button { width: 44px; min-height: 44px; border: 0; background: none; font-size: 1.3rem; color: var(--cor-escura); cursor: pointer; }
    .contador input { border: 0; text-align: center; min-height: 44px; padding: 0; outline-offset: -2px; }
    .idades { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: -4px 0 14px; }
    .idades select + select { margin-top: 6px; }
    .nota-idades { font-size: .8rem; color: var(--suave); margin: -6px 0 14px; }
    .idades label span { font-size: .8rem; color: var(--suave); display: block; margin-bottom: 3px; }
    .enviar { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--cor); color: #fff; font: 600 1.05rem var(--texto); cursor: pointer; margin-top: 4px; }
    .enviar:disabled { opacity: .6; cursor: wait; }
    .aviso { text-align: center; font-size: .9rem; margin: 12px 0 0; min-height: 1.2em; }
    .aviso.erro { color: #b3261e; }
    .feito { text-align: center; padding: 8px 0 4px; }
    .feito .ok { width: 56px; height: 56px; border-radius: 50%; background: var(--cor-fundo); color: var(--cor-escura); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .feito h2 { margin-bottom: 6px; }
    .link-btn { background: none; border: 0; color: var(--cor-escura); font: 600 .95rem var(--texto); text-decoration: underline; cursor: pointer; padding: 8px; }
    .rodape { text-align: center; margin-top: 18px; font-size: .8rem; color: var(--suave); }
    .rodape button { background: none; border: 1px solid var(--linha); border-radius: 999px; padding: 8px 14px; font: inherit; color: var(--suave); cursor: pointer; }
    .carregando, .erro-total { text-align: center; padding: 80px 16px; color: var(--suave); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media print {
      body { background: #fff; }
      .wrap { padding: 0; }
      .cartao { box-shadow: none; }
      .rsvp, .rodape { display: none; }
      .imprimir-rsvp { display: block !important; }
    }
    .rota { margin: 14px 0 0; text-align: left; }
    .mapa { height: 260px; border-radius: 12px; overflow: hidden; border: 1px solid var(--linha); background: var(--linha); z-index: 0; }
    .rota-leg { font-size: .84rem; color: var(--suave); margin: 8px 0 0; display: flex; align-items: center; gap: 8px; }
    .rota-leg .tr { width: 28px; border-top: 4px dashed var(--cor); flex: none; }
    .rota-txt { margin: 8px 0 0; font-size: .95rem; white-space: pre-line; }
    .gps { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; justify-content: center; }
    .gps a { border: 1px solid var(--linha); border-radius: 999px; padding: 9px 14px; font: 600 .88rem var(--texto); color: var(--cor-escura); text-decoration: none; }
    .gps a.gps-principal { background: var(--cor); border-color: var(--cor); color: #fff; flex: 1 1 100%; text-align: center; }
    .rota .nota { font-size: .8rem; color: var(--suave); margin: 8px 0 0; text-align: center; }
    @media print { .gps, .rota .nota { display: none; } }
    .falta { margin: 4px 0 0; font-size: .95rem; color: var(--cor-escura); }
    .btn-avisos { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 20px; padding: 14px 16px; border: 2px solid var(--cor); border-radius: 14px; background: var(--cor-fundo); color: var(--cor-escura); font: 600 1rem var(--texto); text-decoration: none; text-align: left; }
    .btn-avisos svg { width: 26px; height: 26px; flex: none; }
    .btn-avisos small { display: block; font-weight: 500; font-size: .85rem; opacity: .85; }
    .btn-avisos .seta { margin-left: auto; font-size: 1.6rem; line-height: 1; }
    .paginas-botoes { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; } .paginas-botoes .btn-avisos { margin: 0; }
    .btn-avisos.btn-pagina { border-width: 1.5px; border-color: var(--linha); background: transparent; }
    .falta strong { font-size: 1.15rem; }
    .agenda { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0 0; }
    .agenda a, .agenda button { border: 1px solid var(--linha); border-radius: 999px; padding: 8px 14px; font: 600 .88rem var(--texto); color: var(--cor-escura); background: none; text-decoration: none; cursor: pointer; }
    .presentes { margin: 30px 0 0; padding: 26px 0 0; border-top: 1px dashed var(--linha); }
    .presentes h2 { font-family: var(--titulo); font-weight: 650; font-size: 1.25rem; margin: 0 0 12px; }
    .presentes p { margin: 0 0 8px; }
    .presentes ul { list-style: none; padding: 0; margin: 0 auto 6px; max-width: 360px; text-align: left; }
    .presentes li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
    .presentes li small { color: var(--suave); white-space: nowrap; }
    .presentes li.reservado { color: var(--suave); text-decoration: line-through; }
    .presentes li.reservado small { text-decoration: none; }
    .presentes a { color: var(--cor-escura); }
    .presentes .nota { font-size: .82rem; color: var(--suave); }
    .presentes .dica-tit { margin: 10px auto 6px; max-width: 360px; text-align: left; font-weight: 600; }
    .presentes ul.dica { display: flex; flex-direction: column; gap: 8px; margin: 0 auto 14px; }
    .presentes ul.dica li { justify-content: flex-start; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 1px solid var(--linha); border-radius: 12px; background: var(--cor-fundo); line-height: 1.45; overflow-wrap: anywhere; }
    .presentes ul.dica li::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: .5em; border-radius: 50%; background: var(--cor); }
    @media print { .agenda { display: none; } }
    .imprimir-rsvp { display: none; text-align: center; padding: 0 24px 24px; color: var(--suave); font-size: .9rem; }
    /* Contagem regressiva ao vivo */
    .contagem { margin: 18px auto 4px; text-align: center; }
    .contagem[hidden] { display: none; }
    .contagem .ct-tit { margin: 0 0 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--suave); font-weight: 600; }
    .contagem .ct-caixas { display: flex; justify-content: center; gap: 8px; }
    .contagem .cx { min-width: 70px; padding: 10px 6px 8px; border-radius: 14px; background: var(--cor-fundo); color: var(--cor-escura); }
    .contagem .cx b { display: block; font-family: var(--titulo); font-size: 1.85rem; line-height: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
    .contagem .cx small { display: block; margin-top: 5px; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
    .contagem .ct-hoje { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--cor-fundo); color: var(--cor-escura); font-weight: 700; text-transform: none; letter-spacing: 0; }
    /* Botão de confirmar logo no começo */
    .cta { margin: 22px 0 6px; text-align: center; }
    .btn-confirmar { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 18px; border-radius: 14px; background: var(--cor); color: #fff; font: 700 1.05rem var(--texto); text-decoration: none; letter-spacing: 0; text-transform: none; box-shadow: 0 8px 20px -10px var(--cor); }
    .btn-confirmar.feito-ja { background: var(--cor-fundo); color: var(--cor-escura); box-shadow: none; border: 1.5px solid var(--cor); }
    .cta .cta-nota { margin: 8px 0 0; font-size: .86rem; color: var(--suave); text-transform: none; letter-spacing: 0; }
    /* Seções do convite padrão */
    .secao { margin: 30px 0 0; padding: 26px 0 0; border-top: 1px dashed var(--linha); }
    .secao > h2 { font-family: var(--titulo); font-weight: 650; font-size: 1.25rem; margin: 0 0 12px; }
    .secao .local { margin-bottom: 0; }
    @media (max-width: 420px) { .wrap { padding: 16px 12px 40px; } .conteudo { padding: 30px 20px 26px; } .rsvp { padding: 24px 20px 26px; } }
    @media print { .cta, .contagem { display: none; } }
  </style>
  <style id="fixo-css">
    /* Barra fixa de confirmação: fica fora do modelo para valer em qualquer aparência */
    .barra-rsvp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(255, 253, 249, .97); border-top: 1px solid var(--linha, #e6ddd0); box-shadow: 0 -8px 24px -12px rgba(40, 30, 15, .25); transform: translateY(110%); transition: transform .3s ease; }
    .barra-rsvp.on { transform: none; }
    .barra-rsvp a { display: flex; align-items: center; justify-content: center; max-width: 520px; min-height: 50px; margin: 0 auto; border-radius: 14px; background: var(--cor, #b4781f); color: #fff; font: 700 1.02rem/1.2 system-ui, sans-serif; text-decoration: none; }
    .barra-rsvp small { display: block; text-align: center; margin-top: 4px; font: 500 .78rem system-ui, sans-serif; color: var(--suave, #6f665b); }
    body.com-barra { padding-bottom: 96px; }
    @media (prefers-reduced-motion: reduce) { .barra-rsvp { transition: none; } }
    @media print { .barra-rsvp { display: none; } body.com-barra { padding-bottom: 0; } }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p class="carregando">Abrindo o convite…</p></main>
  <script src="config.js"></script>
  <script>
  (() => {
    const API = ((window.LEP_CONFIG || {}).apiUrl || '').replace(/\/+$/, '');
    const qs = new URLSearchParams(location.search);
    const evId = (qs.get('e') || '').trim();
    const convId = (qs.get('c') || '').trim();
    const nomeUrl = (qs.get('p') || '').trim().slice(0, 80);
    const app = document.getElementById('app');
    const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    const ESTILOS = ['ouro', 'rosa', 'azul', 'verde', 'lilas', 'sol'];
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const urlOk = (u) => /^https?:\/\//i.test(String(u || ''));
    const dataLocal = (iso) => { const [a, m, d] = String(iso).split('-').map(Number); return new Date(a, m - 1, d); };
    const hora = (h) => (h ? String(h).replace(':', 'h').replace(/h00$/, 'h') : '');
    const lsKey = `lep.rsvp.${evId}`;
    const lsGet = () => { try { return JSON.parse(localStorage.getItem(lsKey) || 'null'); } catch { return null; } };
    const lsSet = (v) => { try { localStorage.setItem(lsKey, JSON.stringify(v)); } catch { /* sem armazenamento */ } };
    const idAleatorio = () => Math.random().toString(36).slice(2, 10);
    const estrela = '<svg class="enfeite" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M32 8l6.5 14.2 15.5 1.6-11.6 10.4 3.3 15.3L32 41.7l-13.7 7.8 3.3-15.3L10 23.8l15.5-1.6z"/><circle cx="52" cy="10" r="2.2" fill="currentColor" stroke="none"/><circle cx="10" cy="50" r="1.8" fill="currentColor" stroke="none"/><circle cx="56" cy="46" r="1.4" fill="currentColor" stroke="none"/></svg>';

    let reservas = [];
    // Partes do convite podem morar dentro de shadow roots (modelo HTML próprio): procura em todas.
    const RAIZES = [document];
    const $id = (id) => { for (const r of RAIZES) { const e = r.getElementById(id); if (e) return e; } return null; };
    const ARAGUAINA = 3; // Palmas: UTC-3, sem horário de verão
    function quandoUtc(ev) {
      if (!ev.data) return null;
      const [a, m, d] = ev.data.split('-').map(Number);
      const hm = (h) => { const x = /^(\d{1,2}):(\d{2})/.exec(h || ''); return x ? [Number(x[1]), Number(x[2])] : null; };
      const ini = hm(ev.hora_inicio), fim = hm(ev.hora_fim);
      if (!ini) return { diaInteiro: true, ini: `${ev.data.replace(/-/g, '')}`, fim: (() => { const t = new Date(Date.UTC(a, m - 1, d + 1)); return t.toISOString().slice(0, 10).replace(/-/g, ''); })() };
      const t0 = new Date(Date.UTC(a, m - 1, d, ini[0] + ARAGUAINA, ini[1]));
      let t1 = fim ? new Date(Date.UTC(a, m - 1, d, fim[0] + ARAGUAINA, fim[1])) : new Date(t0.getTime() + 4 * 3600e3);
      if (t1 <= t0) t1 = new Date(t1.getTime() + 24 * 3600e3);
      const f = (t) => t.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      return { ini: f(t0), fim: f(t1) };
    }
    function agendaHtml(ev, titulo, local) {
      const q = quandoUtc(ev);
      if (!q) return '';
      const det = `Convite: ${location.href}`;
      const g = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${q.ini}/${q.fim}&details=${encodeURIComponent(det)}&location=${encodeURIComponent(local)}`;
      return `<div class="agenda"><a href="${esc(g)}" target="_blank" rel="noopener">Salvar no Google Agenda</a><button type="button" id="ics">Salvar na agenda do celular</button></div>`;
    }
    function baixarIcs(ev, titulo, local) {
      const q = quandoUtc(ev);
      const e = (t) => String(t).replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
      const dt = q.diaInteiro ? [`DTSTART;VALUE=DATE:${q.ini}`, `DTEND;VALUE=DATE:${q.fim}`] : [`DTSTART:${q.ini}`, `DTEND:${q.fim}`];
      const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Giotto Eventi//Convite//PT', 'BEGIN:VEVENT', `UID:${evId}@eventos-palmas`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')}`, ...dt, `SUMMARY:${e(titulo)}`, local ? `LOCATION:${e(local)}` : null,
        `DESCRIPTION:${e('Convite: ' + location.href)}`, 'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', `DESCRIPTION:${e(titulo)}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
      a.download = 'convite.ics'; document.body.appendChild(a); a.click(); a.remove();
    }
    // Dica de presente: um item por linha (ou separados por " - "); linha que termina em ":" vira subtítulo.
    function dicaHtml(t) {
      const partes = String(t || '').split('\n').flatMap((l) => l.split(/\s+[-–•]\s+/))
        .map((x) => x.replace(/^\s*[-–•*]\s*/, '').trim()).filter(Boolean);
      if (!partes.length) return '';
      let html = '', itens = [];
      const fecha = () => { if (itens.length) html += `<ul class="dica">${itens.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`; itens = []; };
      for (const x of partes) {
        if (/:$/.test(x)) { fecha(); html += `<p class="dica-tit">${esc(x.replace(/:$/, ''))}</p>`; } else itens.push(x);
      }
      fecha();
      return html;
    }
    // Conteúdo da página de presentes: dica (uma por linha, com subtítulos) e a lista para reservar.
    function presentesHtml(ev, minha) {
      const cv = ev.convite || {};
      const lista = (ev.presentes || []).filter((g) => g && g.nome);

    // Link do Google Maps que passa pela rota desenhada: parte de onde a pessoa está, vai até o início da rota

    function linkRota(dest, rota) {
      const ll = (p) => `${p[0]},${p[1]}`;
      let via = [];
      if (rota.length) {
        const n = Math.min(9, rota.length);
        via = Array.from({ length: n }, (_, i) => rota[Math.round((i * (rota.length - 1)) / Math.max(1, n - 1))]);
        const ult = via[via.length - 1];
        if (Math.abs(ult[0] - dest.lat) < 3e-4 && Math.abs(ult[1] - dest.lng) < 3e-4) via.pop();
      }
      return `https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lng}&travelmode=driving${via.length ? `&waypoints=${encodeURIComponent(via.map(ll).join('|'))}` : ''}`;

    function mapaConvite(dest, rota) {

    /* ---- Modelo HTML feito pelo organizador ----

    function limparModelo(doc) {
      doc.querySelectorAll('script,iframe,frame,frameset,object,embed,applet,base,meta,form,portal,noscript,template').forEach((e) => e.remove());
      doc.querySelectorAll('link').forEach((l) => {
        if (!(String(l.rel).toLowerCase() === 'stylesheet' && /^https:\/\/fonts\.googleapis\.com\//.test(l.getAttribute('href') || ''))) l.remove();
      });
      doc.querySelectorAll('set,animate').forEach((e) => { if (/href/i.test(e.getAttribute('attributeName') || '')) e.remove(); });
      const URLS = ['href', 'src', 'xlink:href', 'action', 'formaction', 'srcset', 'poster', 'background', 'data', 'ping'];
      doc.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((a) => {
          const n = a.name.toLowerCase();
          if (n.startsWith('on')) { el.removeAttribute(a.name); return; }
          if (URLS.includes(n)) {
            const v = a.value.replace(/[\s\u0000-\u001f]+/g, '').toLowerCase();
            const imagem = n === 'src' && el.tagName.toLowerCase() === 'img' && v.startsWith('data:image/');

    let CSS_BLOCO = '';
    function cssDosBlocos() {
      if (CSS_BLOCO) return CSS_BLOCO;
      const base = $id('base-css') ? $id('base-css').textContent : '';
      const raiz = (base.match(/:root\s*\{([^}]*)\}/) || [])[1] || '';
      const pad = {};
      raiz.replace(/(--[a-z-]+)\s*:\s*([^;]+);/g, (_, k, v) => { pad[k] = v.trim(); return ''; });
      // Cor do texto e fontes ficam sem padrão de propósito: herdam do modelo.
      ['--tinta', '--texto', '--titulo', '--bg', '--papel'].forEach((k) => delete pad[k]);

        + base.replace(/:root\s*\{[^}]*\}/, '').replace(/body\[data-estilo[^}]*\}/g, '')
          .replace(/var\((--[a-z-]+)\)/g, (m, k) => (pad[k] ? `var(${k}, ${pad[k]})` : m))

    // Some com a linha cujos campos ficaram todos vazios ("Confirme até {{prazo}}" sem prazo) e com o que ficar oco.
    function tirarVazios(doc) {
      const BLOCO = 'p,li,h1,h2,h3,h4,h5,h6,small,figcaption,dt,dd,td,th,blockquote,a,button,strong,b,em,i,span,label';
      const textos = []; const w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      while (w.nextNode()) if (/[\uE000\uE001]/.test(w.currentNode.nodeValue)) textos.push(w.currentNode);

      textos.forEach((t) => {
        if (!t.nodeValue.includes('\uE000')) return;

        while (el && el !== doc.body && el.matches(BLOCO) && !el.textContent.includes('\uE001')) {
          const pai = el.parentElement;
          if (!pai || pai === doc.body || !pai.matches(BLOCO) || pai.textContent.includes('\uE001')) break;

      doc.querySelectorAll('*').forEach((el) => [...el.attributes].forEach((a) => { if (/[\uE000\uE001]/.test(a.value)) el.setAttribute(a.name, a.value.replace(/[\uE000\uE001]/g, '')); }));
      doc.querySelectorAll('title').forEach((t) => { t.textContent = t.textContent.replace(/[\uE000\uE001]/g, ''); });
    }
    function renderProprio(ev, vals, x) {
      let html = String(ev.convite.modelo_html);

      document.getElementById('base-css').remove();
      doc.head.querySelectorAll('style,link').forEach((e) => document.head.appendChild(e));
      document.body.removeAttribute('data-estilo');

      document.body.replaceChildren(...doc.body.childNodes);

        rsvp: () => '<section class="rsvp" id="rsvp" aria-labelledby="rsvp-tit"></section>',

    function erro(msg) { app.innerHTML = `<p class="erro-total">${esc(msg)}</p>`; }

    // Contagem regressiva: conta até o começo da festa e se atualiza sozinha (não fica parada no número do dia em que abriu).
    let ALVO = null;
    function alvoFesta(ev) {

    // Botão "Confirmar presença" no começo do convite e barra fixa embaixo enquanto a confirmação não aparece na tela.

    function ctaHtml(prazoTxt, encerrado) {

    // Páginas do convite: avisos e as páginas que quem convida criar (programação, cardápio, traje…).

    const linhasDe = (t) => String(t || '').split('\n').map((x) => x.replace(/^\s*[-•*]\s*/, '').trim()).filter(Boolean);

      const dest = okC(cv.local_coord) ? cv.local_coord : cv.local_auto && okC(cv.local_auto.coord) ? cv.local_auto.coord : null;
      const rota = (Array.isArray(cv.rota) ? cv.rota : []).filter((p) => Array.isArray(p) && p.length === 2 && isFinite(p[0]) && isFinite(p[1]));
      const lugares = convidado && Number(convidado.lugares) > 0 ? Number(convidado.lugares) : null;
      const pedirIdade = cv.pedir_idade !== false;
      const pedirSexo = cv.pedir_sexo === true || (ev.itens_festa || []).some((i) => i && i.sexo);
      const fim = prazo ? new Date(prazo.getFullYear(), prazo.getMonth(), prazo.getDate() + 1) : null;
      const encerrado = !!(fim && new Date() >= fim && !cv.aceitar_apos_prazo);
      const ondeTxt = [local, endereco].filter(Boolean).join(', ');
      const faltaN = d ? (() => { const h = new Date(); h.setHours(0, 0, 0, 0); return Math.round((d - h) / 864e5); })() : null;
      const prazoTxt = prazo ? `${prazo.getDate()} de ${MESES[prazo.getMonth()]}` : '';

      const VALS = {
          titulo, chamada: cv.chamada || 'Você é nosso convidado especial para', convidado: nome || '', ola: nome ? `Olá, ${nome}!` : '',
          tema: ev.tema || '', data: d ? `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}` : '',
          dia: d ? String(d.getDate()) : '', mes: d ? MESES[d.getMonth()] : '', ano: d ? String(d.getFullYear()) : '', dia_semana: d ? SEMANA[d.getDay()] : '',
          hora: hora(ev.hora_inicio), horario, local, endereco, mensagem: cv.mensagem || '',
          prazo: prazo ? `${prazo.getDate()} de ${MESES[prazo.getMonth()]}` : '',
          faltam: faltaN == null ? '' : faltaN > 1 ? `Faltam ${faltaN} dias` : faltaN === 1 ? 'É amanhã!' : faltaN === 0 ? 'É hoje!' : '',
          lugares: lugares ? `Este convite vale para até ${lugares} ${lugares === 1 ? 'pessoa' : 'pessoas'}.` : '',
          quando: d ? `${d.getDate()} de ${MESES[d.getMonth()]}${horario ? `, ${horario}` : ''}` : '',
      };
      if (cv.modelo === 'html' && String(cv.modelo_html || '').trim()) {
        renderProprio(ev, VALS, { cv, dest, rota, ondeTxt, prazoTxt, ctaOk: !encerrado });
      } else {
      app.innerHTML = `
        <article class="cartao">
          <div class="faixa" aria-hidden="true"></div>
          <div class="conteudo">
            ${nome ? `<p class="ola">Olá, ${esc(nome)}!</p>` : ''}
            <p class="chamada">${esc(cv.chamada || 'Você é nosso convidado especial para')}</p>
            ${estrela}
            <h1>${esc(titulo)}</h1>
            ${ev.tema ? `<p class="tema">${esc(ev.tema)}</p>` : ''}
            ${d ? `<div class="quando"><span class="lado">${esc(SEMANA[d.getDay()].split('-')[0])}</span>
                <span><span class="dia">${d.getDate()}</span><br><span class="mes">${esc(MESES[d.getMonth()])}</span></span>
                <span class="lado">${esc(horario || d.getFullYear())}</span></div>
              <p class="data-longa">${esc(`${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`)}${horario ? ` · ${esc(horario)}` : ''}</p>
              ${contagemHtml()}` : ''}
            ${cv.mensagem ? `<p class="mensagem">${esc(cv.mensagem)}</p>` : ''}
            ${ctaHtml(prazoTxt, encerrado)}
            ${lugares ? `<p class="prazo">Este convite vale para até ${lugares} ${lugares === 1 ? 'pessoa' : 'pessoas'}.</p>` : ''}
            ${paginasBotoes(ev, true) ? `<div class="secao-avisos">${paginasBotoes(ev, true)}</div>` : ''}
            ${local || endereco || dest ? `<section class="secao"><h2>Onde</h2>
              <div class="local">${local ? `<strong>${esc(local)}</strong>` : ''}${endereco ? `<span>${esc(endereco)}</span>` : ''}
              ${!dest && mapa ? `<a href="${esc(mapa)}" target="_blank" rel="noopener">Como chegar</a>` : ''}</div>
              ${dest ? rotaHtml(cv, dest, rota) : ''}</section>` : ''}
            ${agendaHtml(ev, titulo, '') ? `<section class="secao"><h2>Salve a data</h2>${agendaHtml(ev, titulo, [local, endereco].filter(Boolean).join(', '))}</section>` : ''}
          </div>
          <section class="rsvp" id="rsvp" aria-labelledby="rsvp-tit"></section>
          <p class="imprimir-rsvp">Confirme sua presença pelo link do convite${ev.organiza ? ` ou com ${esc(ev.organiza)}` : ''}.</p>
        </article>
        <div class="rodape"><button type="button" onclick="window.print()">Imprimir ou salvar em PDF</button></div>`;
      }
      if (dest && $id('mapa')) mapaConvite(dest, rota);
      const ics = $id('ics');
      if (ics) ics.onclick = () => baixarIcs(ev, titulo, [local, endereco].filter(Boolean).join(', '));
      montarPaginas(ev, VALS);
      CTX = { convidado, nome, lugares, pedirIdade, pedirSexo, encerrado };
      formRsvp(ev, CTX);
      ligarContagem(ev);
      ligarBarra(encerrado, prazoTxt);
      atualizarCta();
    }

    function formRsvp(ev, ctx) {
      const box = $id('rsvp');
      const salvo = lsGet();
      const ant = salvo && (!ctx.convidado || salvo.convidado === ctx.convidado.id) ? salvo : null;
      if (ant && ant.enviado) return obrigado(ev, ctx, ant);
      if (ctx.encerrado) {
        box.innerHTML = `<div class="feito"><h2>Confirmações encerradas</h2>
          <p class="sub">O prazo para responder por aqui já passou.${ev.organiza ? ` Se precisar, fale com ${esc(ev.organiza)}.` : ' Se precisar, fale direto com quem te convidou.'}</p></div>`;
        return;
      }
      const st = {
        resposta: ant ? ant.resposta : '',
        nome: (ant && ant.nome) || ctx.nome || '',
        adultos: ant && ant.adultos != null ? ant.adultos : 1,
        criancas: ant && ant.criancas != null ? ant.criancas : 0,
        idades: ant ? ant.idades || [] : [],
        sexos: ant ? ant.sexos || [] : [],
        contato: (ant && ant.contato) || '',
        mensagem: (ant && ant.mensagem) || '',
        presente: (ant && ant.presente) || '',
      };
      const meuId = ctx.convidado ? `${evId}-${ctx.convidado.id}` : (ant && ant.id) || null;
      const livres = () => (ev.presentes || []).filter((g) => g && g.nome && !reservas.some((r) => r.presente === g.id && r.id !== meuId));
      const opcoesIdade = (v) => ['<option value="">Idade</option>', `<option value="0" ${v === 0 ? 'selected' : ''}>Menos de 1 ano</option>`,
        ...Array.from({ length: 17 }, (_, i) => i + 1).map((n) => `<option value="${n}" ${v === n ? 'selected' : ''}>${n} ${n === 1 ? 'ano' : 'anos'}</option>`)].join('');
      function idadesHtml() {
        if ((!ctx.pedirIdade && !ctx.pedirSexo) || !st.criancas) return '';
        const sx = (i) => `<select data-sexo="${i}" aria-label="Criança ${i + 1}: menino ou menina"><option value="">Menino ou menina?</option>
          <option value="m" ${st.sexos[i] === 'm' ? 'selected' : ''}>Menino</option><option value="f" ${st.sexos[i] === 'f' ? 'selected' : ''}>Menina</option></select>`;
        return `<div class="idades">${Array.from({ length: st.criancas }, (_, i) => `<label><span>Criança ${i + 1}</span>
          ${ctx.pedirIdade ? `<select data-idade="${i}" aria-label="Idade da criança ${i + 1}">${opcoesIdade(st.idades[i])}</select>` : ''}
          ${ctx.pedirSexo ? sx(i) : ''}</label>`).join('')}</div>
          ${ctx.pedirSexo ? '<p class="nota-idades">Perguntamos para separar as lembrancinhas.</p>' : ''}`;
      }
      function desenhar() {
        const vai = st.resposta === 'sim' || st.resposta === 'talvez';
        box.innerHTML = `
          <h2 id="rsvp-tit">Confirme sua presença</h2>
          <p class="sub">Sua resposta ajuda a organizar a festa.</p>
          ${(() => { const g = st.presente && st.resposta !== 'nao' && livres().find((x) => x.id === st.presente); return g ? `<p class="sub pres-escolhido">Presente escolhido: <strong>${esc(g.nome)}</strong>.${vai ? '' : ' Responda “Vou sim” ou “Talvez” e envie para garantir.'}</p>` : ''; })()}
          <div class="escolha" role="group" aria-label="Você vai?">
            <button type="button" data-resp="sim" aria-pressed="${st.resposta === 'sim'}">Vou sim</button>
            <button type="button" data-resp="talvez" aria-pressed="${st.resposta === 'talvez'}">Talvez</button>
            <button type="button" data-resp="nao" aria-pressed="${st.resposta === 'nao'}">Não poderei ir</button>
          </div>
          <form id="f-rsvp" novalidate ${st.resposta ? '' : 'hidden'}>
            <label class="campo"><span>${vai ? 'Seu nome ou da família' : 'Seu nome'}</span>
              <input name="nome" maxlength="80" autocomplete="name" required value="${esc(st.nome)}"></label>
            ${vai ? `<div class="duplo">
                <label class="campo"><span>Adultos</span>${contador('adultos', st.adultos, 1)}</label>
                <label class="campo"><span>Crianças</span>${contador('criancas', st.criancas, 0)}</label>
              </div>
              <div id="idades">${idadesHtml()}</div>` : ''}
            ${vai && livres().length ? `<label class="campo"><span>Quer reservar um presente da lista? (opcional)</span>
              <select name="presente"><option value="">Não, obrigado</option>${livres().map((g) => `<option value="${esc(g.id)}" ${g.id === st.presente ? 'selected' : ''}>${esc(g.nome)}</option>`).join('')}</select></label>` : ''}
            <label class="campo"><span>WhatsApp (opcional)</span><input name="contato" maxlength="30" inputmode="tel" autocomplete="tel" value="${esc(st.contato)}"></label>
            <label class="campo"><span>Recado (opcional)</span><textarea name="mensagem" rows="2" maxlength="300" placeholder="${vai ? 'Alergia alimentar, horário de chegada…' : 'Deixe um recado'}">${esc(st.mensagem)}</textarea></label>
            <button class="enviar" type="submit">${st.resposta === 'sim' ? 'Confirmar presença' : 'Enviar resposta'}</button>
            <p class="aviso" id="aviso" role="status"></p>
          </form>`;
      }
      function contador(k, v, min) {
        return `<span class="contador"><button type="button" data-menos="${k}" aria-label="Menos">−</button>
          <input name="${k}" type="number" inputmode="numeric" min="${min}" max="30" value="${v}" aria-label="${k === 'adultos' ? 'Adultos' : 'Crianças'}">
          <button type="button" data-mais="${k}" aria-label="Mais">+</button></span>`;
      }
      function lerCampos() {
        const f = $id('f-rsvp');
        if (!f) return;
        st.nome = f.nome.value.trim();
        st.contato = f.contato.value.trim();
        st.mensagem = f.mensagem.value.trim();
        st.presente = f.presente ? f.presente.value : (st.resposta === 'nao' ? '' : st.presente);
        if (f.adultos) st.adultos = Math.max(0, Math.min(30, parseInt(f.adultos.value, 10) || 0));
        if (f.criancas) st.criancas = Math.max(0, Math.min(30, parseInt(f.criancas.value, 10) || 0));
      }
      function mudarCriancas(n) {
        st.criancas = Math.max(0, Math.min(30, n));
        st.idades = st.idades.slice(0, st.criancas);
        st.sexos = st.sexos.slice(0, st.criancas);
        const f = $id('f-rsvp');
        f.criancas.value = st.criancas;
        $id('idades').innerHTML = idadesHtml();
      }
      box.onclick = (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.resp) { lerCampos(); st.resposta = b.dataset.resp; desenhar(); const n = box.querySelector('[name=nome]'); if (n && !n.value) n.focus(); return; }
        const k = b.dataset.mais || b.dataset.menos;
        if (k) {
          lerCampos();
          const d = b.dataset.mais ? 1 : -1;
          if (k === 'criancas') mudarCriancas(st.criancas + d);
          else { st.adultos = Math.max(0, Math.min(30, st.adultos + d)); $id('f-rsvp').adultos.value = st.adultos; }
        }
      };
      box.oninput = (e) => {
        if (e.target.name === 'criancas') { lerCampos(); mudarCriancas(st.criancas); e.target.focus(); }
      };
      box.onchange = (e) => {
        const i = e.target.dataset.idade;
        if (i != null) st.idades[Number(i)] = e.target.value === '' ? null : Number(e.target.value);
        const sxi = e.target.dataset.sexo;
        if (sxi != null) st.sexos[Number(sxi)] = e.target.value || null;
      };
      box.onsubmit = async (e) => {
        e.preventDefault();
        lerCampos();
        const av = $id('aviso');
        av.className = 'aviso';
        if (!st.nome) { av.textContent = 'Escreva seu nome.'; av.classList.add('erro'); box.querySelector('[name=nome]').focus(); return; }
        if (st.resposta !== 'nao' && st.adultos + st.criancas < 1) { av.textContent = 'Informe quantas pessoas vão.'; av.classList.add('erro'); return; }
        if (st.resposta === 'sim' && ctx.lugares && st.adultos + st.criancas > ctx.lugares
          && !confirm(`O convite é para até ${ctx.lugares} pessoas. Enviar com ${st.adultos + st.criancas} mesmo assim?`)) return;
        const id = ctx.convidado ? `${evId}-${ctx.convidado.id}` : (ant && ant.id) || `${evId}-r${idAleatorio()}`;
        const vai = st.resposta !== 'nao';
        const dados = {
          evento: evId, convidado: ctx.convidado ? ctx.convidado.id : null, nome: st.nome, resposta: st.resposta,
          adultos: vai ? st.adultos : 0, criancas: vai ? st.criancas : 0,
          idades: vai && ctx.pedirIdade ? st.idades.slice(0, st.criancas).map((x) => (x == null ? null : x)) : [],
          sexos: vai && ctx.pedirSexo ? Array.from({ length: st.criancas }, (_, i) => st.sexos[i] || null) : [],
          contato: st.contato, mensagem: st.mensagem, presente: vai && st.presente ? st.presente : null, atualizado_em: new Date().toISOString(),
        };
        const btn = box.querySelector('.enviar');
        btn.disabled = true; av.textContent = 'Enviando…';
        try {
          const r = await fetch(`${API}/dados/confirmacoes/${encodeURIComponent(id)}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados),
          });
          if (r.status === 409 && dados.presente && (await r.json().catch(() => ({}))).erro === 'presente já reservado') {
            await recarregarReservas();
            st.presente = '';
            desenhar();
            redesenharPresentes();
            const a = $id('aviso');
            a.textContent = 'O presente escolhido acabou de ser reservado por outra pessoa. Escolha outro ou envie sem presente.';
            a.classList.add('erro');
            return;
          }
          if (!r.ok) throw new Error(r.status);
          const reg = { ...dados, id, enviado: true };
          lsSet(reg);
          reservas = reservas.filter((x) => x.id !== id);
          if (reg.presente) reservas.push(reg);
          todos('[data-presentes-corpo]').forEach((el) => { el.innerHTML = presentesHtml(ev, id); });
          obrigado(ev, ctx, reg);
        } catch {
          btn.disabled = false;
          av.textContent = 'Não consegui enviar. Verifique a internet e tente de novo.';
          av.classList.add('erro');
        }
      };
      desenhar();
    }

    function obrigado(ev, ctx, reg) {
      const box = $id('rsvp');
      const vai = reg.resposta === 'sim';
      const talvez = reg.resposta === 'talvez';
      const partes = [reg.adultos ? `${reg.adultos} ${reg.adultos === 1 ? 'adulto' : 'adultos'}` : null,
        reg.criancas ? `${reg.criancas} ${reg.criancas === 1 ? 'criança' : 'crianças'}` : null].filter(Boolean).join(' e ');
      const idades = (reg.idades || []).filter((x) => x != null).map((x) => (x === 0 ? 'menos de 1 ano' : `${x} ${x === 1 ? 'ano' : 'anos'}`));
      box.innerHTML = `<div class="feito">
        <span class="ok" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <h2>${vai ? 'Presença confirmada!' : 'Resposta enviada'}</h2>
        ${(() => { const g = reg.presente && (ev.presentes || []).find((x) => x && x.id === reg.presente); return g ? `<p class="sub">Presente reservado: <strong>${esc(g.nome)}</strong></p>` : ''; })()}
        <p class="sub">${talvez ? `Anotado, ${esc(reg.nome)}: talvez ${esc(partes)}. Se puder, confirme depois por este mesmo link.` : vai ? `${esc(reg.nome)}: ${esc(partes)}${idades.length ? ` (${esc(idades.join(', '))})` : ''}. Até lá!` : `Obrigado por avisar, ${esc(reg.nome)}. Vamos sentir sua falta.`}</p>
        ${ctx.encerrado ? '' : '<button type="button" class="link-btn" id="mudar">Mudar minha resposta</button>'}</div>`;
      if (ctx.encerrado) return;
      $id('mudar').onclick = () => { lsSet({ ...reg, enviado: false }); formRsvp(ev, ctx); atualizarCta(); };
      atualizarCta();
    }

    iniciar();
  })();
  </script>
</body>
</html>
